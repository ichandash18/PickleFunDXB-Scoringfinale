<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101d1a">
<title>Pickleball Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Archivo+Expanded:wght@700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101d1a;
    --panel:#152720;
    --panel-active:#1c3329;
    --court:#28543f;
    --court-line: rgba(244,241,232,0.16);
    --chalk:#f4f1e8;
    --chalk-dim: rgba(244,241,232,0.46);
    --chalk-faint: rgba(244,241,232,0.22);
    --optic:#d7f24d;
    --optic-fg:#d7f24d;
    --optic-dim: rgba(215,242,77,0.28);
    --alert:#ff6b57;
    --alert-dim: rgba(255,107,87,0.24);
  }

  :root[data-theme="light"]{
    --ink:#f7f4ec;
    --panel:#e9efe5;
    --panel-active:#dbe6d8;
    --court:#cfe0d2;
    --court-line: rgba(20,38,30,0.14);
    --chalk:#16261f;
    --chalk-dim: rgba(22,38,31,0.55);
    --chalk-faint: rgba(22,38,31,0.20);
    --optic-fg:#5c7a14;
    --optic-dim: rgba(92,122,20,0.20);
    --alert:#d1503c;
    --alert-dim: rgba(209,80,60,0.20);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    color:var(--chalk);
    font-family:'Archivo', sans-serif;
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: no-preference){
    html, body, .side, .call-readout, .timer-card, .call-readout span, button, .toggle button{ transition: background-color .2s ease, border-color .2s ease, color .2s ease, box-shadow .18s ease; }
  }

  .wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
    max-width: 880px;
    margin: 0 auto;
  }

  /* ---------- header ---------- */
  header{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
  }
  .brand{
    display:flex; flex-direction:column; gap:2px;
  }
  .brand .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.22em;
    color:var(--optic-fg);
    text-transform:uppercase;
  }
  .brand h1{
    font-family:'Archivo Expanded', sans-serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:.01em;
    margin:0;
    text-transform:uppercase;
  }

  .settings{ display:flex; gap:10px; flex-wrap:wrap; }

  .toggle{
    display:flex;
    background:var(--panel);
    border:1px solid var(--court-line);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .toggle button{
    border:none;
    background:transparent;
    color:var(--chalk-dim);
    font-family:'Archivo', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  .toggle button.active{
    background:var(--optic);
    color:#12210f;
  }

  /* ---------- board ---------- */
  .board{
    width:100%;
    display:flex;
    align-items:stretch;
    gap:0;
    position:relative;
    margin-top: 6px;
  }
  .net{
    width:2px;
    flex-shrink:0;
    background-image: linear-gradient(var(--court-line) 60%, transparent 0%);
    background-size: 2px 14px;
    background-repeat: repeat-y;
    position:relative;
  }
  .net::after{
    content:"NET";
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(90deg);
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.3em;
    color: var(--chalk-faint);
    white-space:nowrap;
  }

  .side{
    flex:1;
    background:var(--panel);
    border:1px solid var(--court-line);
    border-radius:18px;
    padding: 26px 20px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    cursor:pointer;
    position:relative;
    min-width:0;
  }
  .side:first-child{ border-radius: 18px 4px 4px 18px; }
  .side:last-child{ border-radius: 4px 18px 18px 4px; }
  .side:active{ background:var(--panel-active); }
  .side.serving{
    border-color: var(--optic-dim);
    box-shadow: inset 0 0 0 1px var(--optic-dim);
  }
  .side.done{ cursor:default; opacity:.55; }

  .name-row{
    width:100%;
    display:flex;
    justify-content:center;
  }
  .name{
    background:transparent;
    border:none;
    color:var(--chalk);
    font-family:'Archivo', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-align:center;
    width:100%;
    padding:4px;
    border-bottom:1px solid transparent;
  }
  .name:focus{ outline:none; border-bottom:1px solid var(--chalk-faint); }

  .score{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(56px, 12vw, 96px);
    line-height:1;
    color:var(--chalk);
  }
  .side.serving .score{ color: var(--optic-fg); }

  .serve-meta{
    display:flex;
    align-items:center;
    gap:8px;
    min-height:20px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--chalk-dim);
  }
  .serve-dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--optic);
    box-shadow: 0 0 0 4px var(--optic-dim);
    opacity:0;
  }
  .side.serving .serve-dot{ opacity:1; }
  .server-num{
    border:1px solid var(--chalk-faint);
    border-radius:5px;
    padding:3px 9px;
    font-size:13px;
    font-weight:700;
    opacity:0;
  }
  .side.serving.doubles .server-num{ opacity:1; color:var(--chalk); border-color:var(--optic-dim); cursor:pointer; }
  .side.serving.doubles .server-num:hover{ background:var(--optic-dim); }

  .winner-tag{
    position:absolute;
    top:12px; left:50%;
    transform:translateX(-50%);
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#12210f;
    background:var(--optic);
    padding:3px 10px;
    border-radius:999px;
    opacity:0;
  }
  .side.won .winner-tag{ opacity:1; }

  /* ---------- timer ---------- */
  .timer-card{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--chalk-faint);
    border-radius:14px;
    padding:18px 24px 20px;
    width:100%;
    max-width:300px;
  }
  .timer-card .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--chalk-faint);
  }
  .timer-display{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-variant-numeric: tabular-nums;
    font-size:42px;
    letter-spacing:.03em;
    color:var(--chalk);
    line-height:1;
  }
  .timer-display.warning{ color: var(--alert); }

  .timer-presets{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:11px;
    letter-spacing:.06em;
    background:transparent;
    border:1px solid var(--chalk-faint);
    color:var(--chalk-dim);
    padding:6px 13px;
    border-radius:999px;
    cursor:pointer;
  }
  .chip.active{ background:var(--optic-dim); border-color:var(--optic-fg); color:var(--chalk); }

  .timer-controls{ display:flex; gap:10px; width:100%; }
  .timer-controls .btn{ flex:1; padding:10px 14px; }

  .timer-card.done{
    border-color:var(--alert);
    animation: pulseAlert 1s ease-in-out infinite;
  }
  .timer-card.done .timer-display{
    color:var(--alert);
    font-size:26px;
    letter-spacing:.14em;
  }
  @keyframes pulseAlert{
    0%,100%{ box-shadow:0 0 0 0 var(--alert-dim); }
    50%{ box-shadow:0 0 0 12px rgba(255,107,87,0); }
  }

  /* ---------- readout ---------- */
  .call-readout{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:var(--panel);
    border:1px solid var(--chalk-faint);
    border-radius:14px;
    padding:14px 28px;
  }
  .call-readout .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--chalk-faint);
  }
  .call-readout .call{
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    letter-spacing:.08em;
    color:var(--chalk);
  }
  .call-readout .call em{
    font-style:normal;
    color:var(--optic-fg);
  }

  /* ---------- controls ---------- */
  .controls{
    margin-top:26px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
    font-family:'Archivo', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:var(--panel);
    color:var(--chalk-dim);
    border:1px solid var(--chalk-faint);
    border-radius:10px;
    padding:11px 18px;
    cursor:pointer;
  }
  .btn:hover{ color:var(--chalk); border-color: var(--optic-dim); background:var(--panel-active); }
  .btn.primary{
    background:var(--optic);
    color:#12210f;
    border-color:var(--optic);
  }
  .btn.primary:hover{ opacity:.9; color:#12210f; }

  .target-row{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--chalk-faint);
  }
  .target-row .toggle button{ padding:6px 12px; font-size:11px; }

  footer{
    margin-top:34px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.14em;
    color:var(--chalk-faint);
    text-align:center;
    max-width:420px;
  }

  @media (max-width: 560px){
    .board{ flex-direction:column; }
    .net{ width:100%; height:14px; background-image: linear-gradient(90deg, var(--court-line) 60%, transparent 0%); background-size:14px 2px; background-repeat:repeat-x; }
    .net::after{ transform:translate(-50%,-50%) rotate(0deg); }
    .side:first-child{ border-radius: 18px 18px 4px 4px; }
    .side:last-child{ border-radius: 4px 4px 18px 18px; }
    header{ justify-content:center; text-align:center; }
    .brand{ align-items:center; }
    .brand h1{ font-size:18px; }
    .side{ padding: 20px 16px 18px; gap:10px; }
    .score{ font-size: clamp(48px, 20vw, 72px); }
    .call-readout{ width:100%; padding:14px 16px; }
    .call-readout .call{ font-size:18px; }
    .target-row{ flex-wrap:wrap; justify-content:center; text-align:center; }
    .controls{ width:100%; flex-direction:column; }
    .btn{ width:100%; padding:14px 18px; font-size:13px; }
    .settings{ justify-content:center; width:100%; }
    .timer-card{ max-width:100%; }
    .timer-display{ font-size:36px; }
    footer{ max-width:100%; }
  }

  /* ---------- landscape phones (short viewport height) ---------- */
  @media (orientation: landscape) and (max-height: 500px){
    .wrap{ padding: calc(10px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px)); }
    header{ margin-bottom:12px; }
    .brand .eyebrow{ display:none; }
    .brand h1{ font-size:15px; }
    .toggle button{ padding:6px 12px; font-size:11px; }
    .side{ padding:12px 14px 10px; gap:6px; }
    .score{ font-size: clamp(34px, 7vw, 52px); }
    .name{ font-size:11px; }
    .serve-meta{ min-height:14px; font-size:10px; }
    .call-readout{ margin-top:10px; padding:8px 20px; }
    .call-readout .call{ font-size:15px; }
    .target-row{ margin-top:10px; font-size:10px; }
    .controls{ margin-top:12px; }
    .btn{ padding:8px 14px; font-size:11px; }
    .timer-card{ margin-top:12px; padding:10px 18px 12px; gap:6px; max-width:280px; }
    .timer-display{ font-size:26px; }
    .timer-card.done .timer-display{ font-size:18px; }
    footer{ display:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="eyebrow">Rally &amp; Score</span>
      <h1>Pickleball Scoreboard</h1>
    </div>
    <div class="settings">
      <div class="toggle" id="themeToggle">
        <button data-theme="dark" class="active">Dark</button>
        <button data-theme="light">Light</button>
      </div>
      <div class="toggle" id="modeToggle">
        <button data-mode="singles" class="active">Singles</button>
        <button data-mode="doubles">Doubles</button>
      </div>
    </div>
  </header>

  <div class="board" id="board">
    <section class="side serving" data-side="0">
      <div class="winner-tag">Winner</div>
      <div class="name-row"><input class="name" id="name0" value="Player A" maxlength="16"></div>
      <div class="score" id="score0">0</div>
      <div class="serve-meta">
        <span class="serve-dot"></span>
        <span id="servelabel0">serving</span>
        <span class="server-num" id="servernum0">2</span>
      </div>
    </section>

    <div class="net"></div>

    <section class="side" data-side="1">
      <div class="winner-tag">Winner</div>
      <div class="name-row"><input class="name" id="name1" value="Player B" maxlength="16"></div>
      <div class="score" id="score1">0</div>
      <div class="serve-meta">
        <span class="serve-dot"></span>
        <span id="servelabel1">serving</span>
        <span class="server-num" id="servernum1">2</span>
      </div>
    </section>
  </div>

  <div class="call-readout">
    <span class="eyebrow">Serve call</span>
    <span class="call" id="callText">0 – 0 – 2</span>
  </div>

  <div class="target-row">
    Play to
    <div class="toggle" id="targetToggle">
      <button data-target="11" class="active">11</button>
      <button data-target="15">15</button>
      <button data-target="21">21</button>
    </div>
    win by 2
  </div>

  <div class="controls">
    <button class="btn" id="sideOutBtn">Side Out</button>
    <button class="btn" id="undoBtn">Undo</button>
    <button class="btn primary" id="newGameBtn">New Game</button>
  </div>

  <div class="timer-card" id="timerCard">
    <span class="eyebrow">Timeout Clock</span>
    <div class="timer-display" id="timerDisplay">10:00</div>
    <div class="timer-presets" id="timerPresets">
      <button class="chip active" data-secs="600">10:00</button>
      <button class="chip" data-secs="720">12:00</button>
      <button class="chip" data-secs="900">15:00</button>
    </div>
    <div class="timer-controls">
      <button class="btn" id="timerStartBtn">Start</button>
      <button class="btn" id="timerResetBtn">Reset</button>
    </div>
  </div>

  <footer>Tap a side to award the rally to that player or team. Serve and side-out follow standard pickleball rules automatically.</footer>

</div>

<script>
(function(){
  const state = {
    mode: 'singles',
    target: 11,
    score: [0,0],
    servingSide: 0,
    serverNumber: 2,      // doubles: team starts as if "second server" (loses serve on first fault)
    firstServiceOfGame: true,
    gameOver: false,
    winner: null,
  };
  let history = [];

  const el = {
    board: document.getElementById('board'),
    sides: [document.querySelector('.side[data-side="0"]'), document.querySelector('.side[data-side="1"]')],
    score: [document.getElementById('score0'), document.getElementById('score1')],
    serveLabel: [document.getElementById('servelabel0'), document.getElementById('servelabel1')],
    serverNum: [document.getElementById('servernum0'), document.getElementById('servernum1')],
    name: [document.getElementById('name0'), document.getElementById('name1')],
    callText: document.getElementById('callText'),
    modeToggle: document.getElementById('modeToggle'),
    themeToggle: document.getElementById('themeToggle'),
    targetToggle: document.getElementById('targetToggle'),
    sideOutBtn: document.getElementById('sideOutBtn'),
    undoBtn: document.getElementById('undoBtn'),
    newGameBtn: document.getElementById('newGameBtn'),
    timerCard: document.getElementById('timerCard'),
    timerDisplay: document.getElementById('timerDisplay'),
    timerPresets: document.getElementById('timerPresets'),
    timerStartBtn: document.getElementById('timerStartBtn'),
    timerResetBtn: document.getElementById('timerResetBtn'),
  };

  const timer = {
    total: 600,
    remaining: 600,
    running: false,
    intervalId: null,
    audioCtx: null,
  };

  function formatTime(s){
    const m = Math.floor(s/60);
    const sec = s % 60;
    return `${m}:${sec.toString().padStart(2,'0')}`;
  }

  function renderTimer(){
    if(timer.remaining <= 0 && !timer.running && timer.timesUp){
      el.timerDisplay.textContent = "TIME'S UP";
    } else {
      el.timerDisplay.textContent = formatTime(timer.remaining);
    }
    el.timerDisplay.classList.toggle('warning', timer.running && timer.remaining <= 10 && timer.remaining > 0);
    el.timerStartBtn.textContent = timer.running ? 'Pause' : 'Start';
  }

  function ensureAudio(){
    if(!timer.audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) timer.audioCtx = new Ctx();
    }
    if(timer.audioCtx && timer.audioCtx.state === 'suspended'){
      timer.audioCtx.resume();
    }
  }

  function beep(freq, delaySec, durationSec){
    const ctx = timer.audioCtx;
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const t0 = ctx.currentTime + delaySec;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durationSec);
    osc.start(t0);
    osc.stop(t0 + durationSec + 0.02);
  }

  function soundAlarm(){
    ensureAudio();
    beep(880, 0, 0.18);
    beep(880, 0.28, 0.18);
    beep(880, 0.56, 0.35);
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
  }

  function stopInterval(){
    if(timer.intervalId){ clearInterval(timer.intervalId); timer.intervalId = null; }
  }

  function timerFinished(){
    timer.running = false;
    timer.timesUp = true;
    stopInterval();
    el.timerCard.classList.add('done');
    renderTimer();
    soundAlarm();
  }

  function startTimer(){
    ensureAudio();
    if(timer.remaining <= 0) timer.remaining = timer.total;
    timer.timesUp = false;
    el.timerCard.classList.remove('done');
    timer.running = true;
    renderTimer();
    stopInterval();
    timer.intervalId = setInterval(() => {
      timer.remaining--;
      if(timer.remaining <= 0){
        timer.remaining = 0;
        timerFinished();
      } else {
        renderTimer();
      }
    }, 1000);
  }

  function pauseTimer(){
    timer.running = false;
    stopInterval();
    renderTimer();
  }

  function resetTimer(){
    timer.running = false;
    timer.timesUp = false;
    stopInterval();
    timer.remaining = timer.total;
    el.timerCard.classList.remove('done');
    renderTimer();
  }

  function setTimerPreset(secs){
    timer.total = secs;
    resetTimer();
    document.querySelectorAll('#timerPresets .chip').forEach(c => c.classList.toggle('active', Number(c.dataset.secs) === secs));
  }

  function setTheme(theme){
    const t = theme === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('active', b.dataset.theme === t));
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if(metaTheme) metaTheme.content = t === 'light' ? '#f7f4ec' : '#101d1a';
    try{ localStorage.setItem('pb-theme', t); }catch(e){}
  }

  function snapshot(){
    return JSON.parse(JSON.stringify(state));
  }

  function pushHistory(){
    history.push(snapshot());
    if(history.length > 100) history.shift();
  }

  function resetGame(keepNames){
    state.score = [0,0];
    state.servingSide = 0;
    state.serverNumber = 2;
    state.firstServiceOfGame = true;
    state.gameOver = false;
    state.winner = null;
    history = [];
    render();
  }

  function checkWin(){
    const [a,b] = state.score;
    const t = state.target;
    if(a >= t && a - b >= 2){ state.gameOver = true; state.winner = 0; }
    else if(b >= t && b - a >= 2){ state.gameOver = true; state.winner = 1; }
  }

  function addPoint(side){
    if(state.gameOver) return;
    pushHistory();

    if(state.mode === 'singles'){
      if(side === state.servingSide){
        state.score[side]++;
      } else {
        state.servingSide = side; // side out, no score change
      }
    } else {
      if(side === state.servingSide){
        state.score[side]++;
      } else {
        if(state.firstServiceOfGame){
          state.firstServiceOfGame = false;
          state.servingSide = side;
          state.serverNumber = 1;
        } else if(state.serverNumber === 1){
          state.serverNumber = 2;
        } else {
          state.servingSide = side;
          state.serverNumber = 1;
        }
      }
    }
    checkWin();
    render();
  }

  function sideOut(){
    if(state.gameOver) return;
    pushHistory();

    if(state.mode === 'singles'){
      state.servingSide = 1 - state.servingSide;
    } else {
      if(state.firstServiceOfGame){
        state.firstServiceOfGame = false;
        state.servingSide = 1 - state.servingSide;
        state.serverNumber = 1;
      } else if(state.serverNumber === 1){
        state.serverNumber = 2;
      } else {
        state.servingSide = 1 - state.servingSide;
        state.serverNumber = 1;
      }
    }
    render();
  }

  function setServer(side, num){
    if(state.mode !== 'doubles' || state.gameOver) return;
    if(state.servingSide !== side) return; // only the serving side's number can be corrected
    pushHistory();
    state.serverNumber = num;
    state.firstServiceOfGame = false;
    render();
  }

  function undo(){
    if(history.length === 0) return;
    const prev = history.pop();
    Object.assign(state, prev);
    render();
  }

  function setMode(mode){
    state.mode = mode;
    resetGame();
    document.querySelectorAll('#modeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    el.board.classList.toggle('doubles-mode', mode === 'doubles');
    el.sides.forEach(s => s.classList.toggle('doubles', mode === 'doubles'));
  }

  function setTarget(t){
    state.target = t;
    document.querySelectorAll('#targetToggle button').forEach(b => b.classList.toggle('active', Number(b.dataset.target) === t));
    resetGame();
  }

  function render(){
    for(let i=0;i<2;i++){
      el.score[i].textContent = state.score[i];
      const serving = state.servingSide === i && !state.gameOver;
      el.sides[i].classList.toggle('serving', serving);
      el.sides[i].classList.toggle('done', state.gameOver);
      el.sides[i].classList.toggle('won', state.gameOver && state.winner === i);
      el.serveLabel[i].textContent = 'serving';
      el.serverNum[i].textContent = state.serverNumber;
    }

    if(state.gameOver){
      const wname = el.name[state.winner].value || (state.winner === 0 ? 'Player A' : 'Player B');
      el.callText.innerHTML = `<em>${wname} wins</em>`;
    } else if(state.mode === 'singles'){
      const s = state.servingSide;
      el.callText.innerHTML = `${state.score[s]} – ${state.score[1-s]}`;
    } else {
      const s = state.servingSide;
      el.callText.innerHTML = `${state.score[s]} – ${state.score[1-s]} – <em>${state.serverNumber}</em>`;
    }
  }

  el.sides.forEach((sideEl, i) => {
    sideEl.addEventListener('click', (e) => {
      if(e.target.classList.contains('name')) return;
      addPoint(i);
    });
  });

  el.modeToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    setMode(btn.dataset.mode);
  });

  el.themeToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    setTheme(btn.dataset.theme);
  });

  el.targetToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    setTarget(Number(btn.dataset.target));
  });

  el.sideOutBtn.addEventListener('click', sideOut);
  el.undoBtn.addEventListener('click', undo);
  el.newGameBtn.addEventListener('click', () => resetGame());

  el.serverNum.forEach((badge, i) => {
    badge.addEventListener('click', (e) => {
      if(state.mode !== 'doubles' || state.servingSide !== i) return;
      e.stopPropagation();
      setServer(i, state.serverNumber === 1 ? 2 : 1);
    });
  });

  el.name.forEach(input => {
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') input.blur(); });
  });

  el.timerStartBtn.addEventListener('click', () => {
    if(timer.running) pauseTimer(); else startTimer();
  });
  el.timerResetBtn.addEventListener('click', resetTimer);
  el.timerPresets.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if(!chip) return;
    setTimerPreset(Number(chip.dataset.secs));
  });

  renderTimer();
  render();

  let savedTheme = 'dark';
  try{ savedTheme = localStorage.getItem('pb-theme') || 'dark'; }catch(e){}
  setTheme(savedTheme);
})();
</script>
</body>
</html>
